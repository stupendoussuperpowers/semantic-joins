[project]
name = "semjoin"
version = "0.1.0"
description = "Evaluation harness for semantic join strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pycountry>=24.6",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
semjoin = "semjoin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
